# Fly.io — BatOnBoard game server (apps/server)
# ห้องเก็บในหน่วยความจำ: ต้องรัน "เครื่องเดียว" และห้ามหยุดเครื่องอัตโนมัติ
# (ดู docs/deploy.md)

# เปลี่ยนเป็นชื่อ app ของคุณ (ชื่อนี้ต้องไม่ซ้ำทั้ง Fly.io)
app = "batonboard-server"
# สิงคโปร์ — ใกล้ไทยที่สุด
primary_region = "sin"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  # โดเมนเว็บบน Vercel (คั่นหลายค่าด้วย comma, ใช้ * แทน subdomain ได้หนึ่งช่วง)
  WEB_ORIGIN = "https://batonboard.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  # state อยู่ในหน่วยความจำ: เครื่องหยุด = ห้องหายหมด
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
